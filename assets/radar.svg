<svg width="1400" height="300" viewBox="0 0 1400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
  <radialGradient id="rg"><stop offset="0" stop-color="#7C3AED" stop-opacity=".35"/><stop offset="1" stop-color="#7C3AED" stop-opacity="0"/></radialGradient>
  <linearGradient id="lg" x1="300" y1="0" x2="1100" y2="0"><stop stop-color="#22D3EE"/><stop offset=".5" stop-color="#8B5CF6"/><stop offset="1" stop-color="#F472B6"/></linearGradient>
  <style>
   .spin{transform-origin:700px 150px;animation:spin 9s linear infinite}
   .p1{animation:p 3s ease-in-out infinite}.p2{animation:p 3s ease-in-out .8s infinite}.p3{animation:p 3s ease-in-out 1.6s infinite}
   @keyframes spin{to{transform:rotate(360deg)}}@keyframes p{0%,100%{opacity:.35}50%{opacity:1}}
  </style>
</defs>
<rect width="1400" height="300" rx="28" fill="#070A12" stroke="#182238"/>
<circle cx="700" cy="150" r="110" stroke="#273449"/><circle cx="700" cy="150" r="75" stroke="#202B3D"/><circle cx="700" cy="150" r="40" stroke="#1B2534"/>
<circle cx="700" cy="150" r="120" fill="url(#rg)"/>
<path d="M700 150L700 35" stroke="url(#lg)" stroke-width="4" class="spin"/>
<circle cx="640" cy="105" r="6" fill="#22D3EE" class="p1"/><circle cx="760" cy="130" r="6" fill="#A78BFA" class="p2"/><circle cx="720" cy="205" r="6" fill="#F472B6" class="p3"/>
<text x="70" y="86" fill="#64748B" font-size="15" font-family="ui-monospace,Menlo,monospace">CURRENT RADAR</text>
<text x="70" y="128" fill="#E2E8F0" font-size="22" font-family="Inter,Arial">Full-Stack Systems</text>
<text x="70" y="160" fill="#94A3B8" font-size="17" font-family="ui-monospace,Menlo,monospace">UI · APIs · Databases · Deployment</text>
<text x="1010" y="128" fill="#E2E8F0" font-size="22" font-family="Inter,Arial">Intelligent Products</text>
<text x="1010" y="160" fill="#94A3B8" font-size="17" font-family="ui-monospace,Menlo,monospace">RAG · ML · Agents · Search</text>
</svg>