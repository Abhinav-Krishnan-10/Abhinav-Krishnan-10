<svg width="1400" height="560" viewBox="0 0 1400 560" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1400" y2="560">
    <stop offset="0" stop-color="#050816"/>
    <stop offset=".45" stop-color="#0A0F25"/>
    <stop offset="1" stop-color="#050816"/>
  </linearGradient>
  <linearGradient id="grad" x1="150" y1="100" x2="1250" y2="460">
    <stop stop-color="#00E5FF"/>
    <stop offset=".33" stop-color="#7C3AED"/>
    <stop offset=".66" stop-color="#EC4899"/>
    <stop offset="1" stop-color="#22C55E"/>
  </linearGradient>
  <radialGradient id="nebulaA">
    <stop offset="0" stop-color="#7C3AED" stop-opacity=".75"/>
    <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="nebulaB">
    <stop offset="0" stop-color="#06B6D4" stop-opacity=".55"/>
    <stop offset="1" stop-color="#06B6D4" stop-opacity="0"/>
  </radialGradient>
  <filter id="blur36"><feGaussianBlur stdDeviation="36"/></filter>
  <filter id="blur12"><feGaussianBlur stdDeviation="12"/></filter>
  <filter id="glow">
    <feGaussianBlur stdDeviation="4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <clipPath id="screenClip"><rect x="872" y="132" width="322" height="230" rx="22"/></clipPath>
  <style>
    .floatA{animation:floatA 7s ease-in-out infinite}
    .floatB{animation:floatB 9s ease-in-out infinite}
    .orbit1{transform-origin:1030px 260px;animation:rot 16s linear infinite}
    .orbit2{transform-origin:1030px 260px;animation:rotR 22s linear infinite}
    .pulse{animation:pulse 3s ease-in-out infinite}
    .pulse2{animation:pulse 3.8s ease-in-out .8s infinite}
    .scan{animation:scan 6.5s ease-in-out infinite}
    .dash{stroke-dasharray:10 14;animation:dash 14s linear infinite}
    .fade1{animation:cycle 12s ease-in-out infinite}
    .fade2{animation:cycle 12s ease-in-out 3s infinite}
    .fade3{animation:cycle 12s ease-in-out 6s infinite}
    .fade4{animation:cycle 12s ease-in-out 9s infinite}
    .blink{animation:blink 1s steps(2,end) infinite}
    .twinkle1{animation:twinkle 3s ease-in-out infinite}
    .twinkle2{animation:twinkle 4.3s ease-in-out .8s infinite}
    .twinkle3{animation:twinkle 5.2s ease-in-out 1.6s infinite}
    @keyframes floatA{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
    @keyframes floatB{0%,100%{transform:translateY(0) translateX(0)}50%{transform:translateY(10px) translateX(-8px)}}
    @keyframes rot{to{transform:rotate(360deg)}}
    @keyframes rotR{to{transform:rotate(-360deg)}}
    @keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
    @keyframes scan{0%{transform:translateY(-260px);opacity:0}20%{opacity:.45}50%{transform:translateY(250px);opacity:.35}80%,100%{opacity:0}}
    @keyframes dash{to{stroke-dashoffset:-260}}
    @keyframes cycle{0%,18%{opacity:0}25%,45%{opacity:1}52%,100%{opacity:0}}
    @keyframes blink{50%{opacity:0}}
    @keyframes twinkle{0%,100%{opacity:.2}50%{opacity:1}}
  </style>
</defs>

<rect width="1400" height="560" rx="34" fill="url(#bg)"/>
<rect x="1" y="1" width="1398" height="558" rx="33" stroke="#172036" stroke-width="2"/>

<circle cx="1160" cy="110" r="220" fill="url(#nebulaA)" filter="url(#blur36)" class="floatA"/>
<circle cx="1070" cy="390" r="200" fill="url(#nebulaB)" filter="url(#blur36)" class="floatB"/>

<!-- stars -->
<g fill="#94A3B8">
  <circle cx="90" cy="70" r="2" class="twinkle1"/><circle cx="210" cy="95" r="1.6" class="twinkle2"/>
  <circle cx="365" cy="55" r="1.5" class="twinkle3"/><circle cx="610" cy="95" r="1.6" class="twinkle1"/>
  <circle cx="760" cy="60" r="2" class="twinkle2"/><circle cx="1280" cy="80" r="1.5" class="twinkle3"/>
  <circle cx="1320" cy="320" r="2" class="twinkle1"/><circle cx="1225" cy="490" r="1.5" class="twinkle2"/>
  <circle cx="690" cy="500" r="1.6" class="twinkle3"/><circle cx="440" cy="470" r="2" class="twinkle1"/>
</g>

<!-- left content -->
<text x="94" y="116" fill="#64748B" font-size="19" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="2">DEVELOPER PROFILE // ONLINE</text>

<text x="90" y="202" fill="#F8FAFC" font-size="68" font-weight="800" font-family="Inter,Segoe UI,Arial,sans-serif" letter-spacing="-2.5">
ABHINAV KRISHNAN
</text>

<rect x="92" y="226" width="650" height="4" rx="2" fill="url(#grad)"/>

<text x="96" y="278" fill="#67E8F9" font-size="28" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" class="fade1">AI × Full-Stack Developer</text>
<text x="96" y="278" fill="#C4B5FD" font-size="28" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" class="fade2">Building products, not just demos</text>
<text x="96" y="278" fill="#F9A8D4" font-size="28" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" class="fade3">Frontend → Backend → Data → AI</text>
<text x="96" y="278" fill="#86EFAC" font-size="28" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" class="fade4">Design · Build · Ship · Evolve</text>

<text x="96" y="338" fill="#94A3B8" font-size="18" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
B.Tech · Artificial Intelligence &amp; Data Science
</text>

<g>
  <rect x="94" y="380" width="208" height="44" rx="22" fill="#0F172A" stroke="#22304A"/>
  <circle cx="119" cy="402" r="6" fill="#22C55E" class="pulse"/>
  <text x="138" y="409" fill="#CBD5E1" font-size="15" font-family="ui-monospace,Menlo,monospace">building now</text>

  <rect x="316" y="380" width="196" height="44" rx="22" fill="#0F172A" stroke="#22304A"/>
  <circle cx="341" cy="402" r="6" fill="#22D3EE" class="pulse2"/>
  <text x="360" y="409" fill="#CBD5E1" font-size="15" font-family="ui-monospace,Menlo,monospace">learning daily</text>

  <rect x="526" y="380" width="212" height="44" rx="22" fill="#0F172A" stroke="#22304A"/>
  <circle cx="551" cy="402" r="6" fill="#A78BFA" class="pulse"/>
  <text x="570" y="409" fill="#CBD5E1" font-size="15" font-family="ui-monospace,Menlo,monospace">shipping ideas</text>
</g>

<!-- right device -->
<g class="floatA">
  <rect x="840" y="100" width="380" height="294" rx="28" fill="#09101E" stroke="#29364E" stroke-width="2"/>
  <rect x="858" y="118" width="344" height="258" rx="22" fill="#050A13" stroke="#18233A"/>
  <circle cx="879" cy="140" r="5" fill="#EF4444"/>
  <circle cx="897" cy="140" r="5" fill="#F59E0B"/>
  <circle cx="915" cy="140" r="5" fill="#22C55E"/>
  <g clip-path="url(#screenClip)">
    <text x="886" y="183" fill="#67E8F9" font-size="16" font-family="ui-monospace,Menlo,monospace">const stack = &#123;</text>
    <text x="906" y="213" fill="#C4B5FD" font-size="15" font-family="ui-monospace,Menlo,monospace">frontend: "React",</text>
    <text x="906" y="242" fill="#86EFAC" font-size="15" font-family="ui-monospace,Menlo,monospace">backend: "FastAPI",</text>
    <text x="906" y="271" fill="#F9A8D4" font-size="15" font-family="ui-monospace,Menlo,monospace">data: "Postgres",</text>
    <text x="906" y="300" fill="#FDE68A" font-size="15" font-family="ui-monospace,Menlo,monospace">ai: "RAG + ML"</text>
    <text x="886" y="329" fill="#67E8F9" font-size="16" font-family="ui-monospace,Menlo,monospace">&#125;<tspan class="blink">_</tspan></text>
    <rect x="858" y="118" width="344" height="3" fill="url(#grad)" opacity=".75" class="scan"/>
  </g>
</g>

<!-- orbit system -->
<circle cx="1030" cy="255" r="170" stroke="#334155" stroke-opacity=".32" class="dash"/>
<circle cx="1030" cy="255" r="135" stroke="#334155" stroke-opacity=".22"/>
<g class="orbit1">
  <circle cx="1030" cy="85" r="8" fill="#22D3EE" filter="url(#glow)"/>
  <circle cx="1200" cy="255" r="7" fill="#A78BFA" filter="url(#glow)"/>
  <circle cx="1030" cy="425" r="7" fill="#F472B6" filter="url(#glow)"/>
  <circle cx="860" cy="255" r="6" fill="#34D399" filter="url(#glow)"/>
</g>
<g class="orbit2">
  <circle cx="1030" cy="120" r="5" fill="#FDE68A"/>
  <circle cx="1165" cy="255" r="5" fill="#22D3EE"/>
  <circle cx="1030" cy="390" r="5" fill="#A78BFA"/>
  <circle cx="895" cy="255" r="5" fill="#F472B6"/>
</g>

<text x="95" y="503" fill="#475569" font-size="14" font-family="ui-monospace,Menlo,monospace">
github.com/Abhinav-Krishnan-10
</text>
</svg>